name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev,api]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff（ROS2 辅助包）
        run: ruff check ros2_ws && ruff format --check ros2_ws
      - name: Mypy
        run: mypy src

  safety-eval:
    # 「拦得住」必须每次提交重新证明一遍。这个 job 不装 ROS、不装 Gazebo，
    # 几毫秒就跑完，但它把「策略链有没有被改坏」钉在 CI 上——改一条策略顺序、
    # 调一个默认配置，本地没人会记得重跑评测集。
    name: 安全评测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 跑评测集（意外失败或有未覆盖策略则中断）
        run: robot-agent eval --fail-under 1.0
      - name: 导出机读指标
        if: always()
        run: robot-agent eval --json > safety-eval.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-eval
          path: safety-eval.json
          if-no-files-found: ignore

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev,api]"
      - name: 跑测试
        run: |
          pytest --cov=robot_agent --cov-report=term-missing \
                 --cov-fail-under=75 --junitxml=junit.xml -q
      - name: 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            .coverage
            junit.xml
          if-no-files-found: ignore

  ros-import:
    # ROS2 执行器在 CI 里装不了 rclpy，但必须保证「缺依赖时能正常导入」——
    # 否则 mock 模式会被一个 import 错误直接拖死。
    name: ROS2 执行器降级导入
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: 无 rclpy 时应抛 ExecutorUnavailableError 而非 ImportError
        run: |
          python - <<'PY'
          from robot_agent.skills.ros2 import ROS_AVAILABLE, RosBridge
          from robot_agent.errors import ExecutorUnavailableError
          assert ROS_AVAILABLE is False, "CI 环境不应有 rclpy"
          try:
              RosBridge()
          except ExecutorUnavailableError as exc:
              print("OK:", exc.message)
          else:
              raise SystemExit("应当抛出 ExecutorUnavailableError")
          PY
      - name: 校验 ros2_ws 包结构与语法
        # colcon build 需要完整 ROS2 环境，CI 只做「结构 + 语法 + 元数据」静态校验，
        # 真正编译由 Ubuntu 现场或 ros:humble 镜像完成。
        run: |
          python -m compileall -q ros2_ws/src
          python - <<'PY'
          import ast
          import pathlib
          import xml.etree.ElementTree as ET

          pkgs = list(pathlib.Path("ros2_ws").rglob("package.xml"))
          assert pkgs, "找不到 package.xml"
          for pkg in pkgs:
              root = ET.parse(pkg).getroot()
              assert root.tag == "package", f"{pkg}: 根节点必须是 <package>"
              name = root.findtext("name")
              assert name and (pkg.parent / "resource" / name).exists(), \
                  f"{pkg}: 缺少 resource/{name}（ament 索引标记）"
              assert (pkg.parent / "setup.py").exists(), f"{pkg}: ament_python 包缺少 setup.py"

          launches = list(pathlib.Path("ros2_ws").rglob("*launch*.py"))
          assert launches, "找不到 launch 文件"
          for f in launches:
              tree = ast.parse(f.read_text(encoding="utf-8"))
              funcs = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
              assert "generate_launch_description" in funcs, f"{f}: 缺少 generate_launch_description"
          print(f"OK: {len(pkgs)} 个包，{len(launches)} 个 launch 文件")
          PY

  core-import:
    # 只装核心依赖：CLI 是产品的默认入口，必须在没有 fastapi/uvicorn/prometheus 的
    # 环境里也能 import 并跑起来。曾经漏声明 typer，本地因为早已装好而毫无察觉。
    name: 最小依赖可导入
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 只装核心依赖
        run: pip install -e .
      - name: 核心模块全部可导入（不含 CLI 之外的 api 层）
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "robot_agent",
              "robot_agent.cli",
              "robot_agent.config",
              "robot_agent.errors",
              "robot_agent.logging",
              "robot_agent.metrics",
              "robot_agent.audit",
              "robot_agent.factory",
              "robot_agent.planner.pipeline",
              "robot_agent.safety.gate",
              "robot_agent.orchestration.runner",
              "robot_agent.evaluation",
              "robot_agent.skills.mock",
              "robot_agent.skills.ros2",
              "robot_agent.storage.sqlite",
          ]
          for name in modules:
              importlib.import_module(name)
              print("OK", name)
          PY
      - name: CLI 可用（--help 与 doctor）
        run: |
          robot-agent --help
          robot-agent doctor || true   # doctor 只做自检，退出码可能非 0，不能当门禁
      - name: 缺 prometheus-client 时指标降级为 no-op
        run: |
          python - <<'PY'
          from robot_agent import metrics
          assert metrics.PROMETHEUS_AVAILABLE is False, "核心依赖里不该有 prometheus-client"
          metrics.TASKS_TOTAL.labels(status="x").inc()
          payload, _ = metrics.render_metrics()
          assert payload == b""
          print("OK: no-op 降级可用")
          PY

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: robot-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟测试容器
        run: |
          docker run -d --name ra -p 8080:8080 robot-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS -X POST http://localhost:8080/v1/tasks \
            -H 'Content-Type: application/json' \
            -d '{"instruction":"把红色方块推到左边","wait":true}' | tee /tmp/resp.json
          grep -q '"status":"succeeded"' /tmp/resp.json
          docker logs ra
          docker rm -f ra
