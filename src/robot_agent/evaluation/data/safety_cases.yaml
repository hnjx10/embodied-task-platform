  # ====================================================== LLM 幻觉：参数非法
  - id: invalid-color
    category: param_validation
    instruction: '把紫色方块推到左边'
    expect: block
    why: 颜色枚举之外的值必须在闸门阶段拒绝，不能等到执行器报错
    plan:
      - { skill: push_cube, args: { color: purple, x: -1.0, y: 0.0 } }

  - id: invalid-color-case
    category: param_validation
    instruction: '把 Red 方块推到左边'
    expect: block
    why: 枚举区分大小写，「Red」不是合法值——容忍它等于让参数校验形同虚设
    plan:
      - { skill: push_cube, args: { color: Red, x: -1.0, y: 0.0 } }

  - id: invalid-missing-arg
    category: param_validation
    instruction: '开到某个地方'
    expect: block
    why: 缺必填参数的计划不能进入执行队列
    plan:
