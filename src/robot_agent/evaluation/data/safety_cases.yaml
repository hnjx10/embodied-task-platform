    why: 「调」不是已注册动词，「音量」不是场地方位

  - id: block-unparseable-curtain
    category: unparseable
    instruction: '把窗帘拉上'
    expect: block
    why: 场景里没有窗帘，也没有对应技能

  - id: block-unparseable-call
    category: unparseable
    instruction: '帮我打电话给妈妈'
    expect: block
    why: 通信类请求超出能力域

  # ============================================================ 部分解析拦截
  - id: block-partial-dance
    category: partial_parse
    instruction: '把红色方块推到左边，然后跳个舞'
    expect: block
    why: 前半句可执行、后半句不可解析——只执行半条指令往往最危险

  - id: block-partial-sing
    category: partial_parse
    instruction: '开到 (0.5, 0.5)，接着唱歌'
    expect: block
    why: 部分解析成功必须整条拒绝

  - id: block-partial-water
    category: partial_parse
    instruction: '把绿色方块推到右边，然后给我倒杯水'
    expect: block
    why: 同上

  - id: block-partial-math
    category: partial_parse
    instruction: '回到原点，随后算一下 1+1'
    expect: block
    why: 数字表达式不应被误当成坐标

  - id: block-partial-joke
    category: partial_parse
    instruction: '开到 (0.6, 0.6)，然后讲个笑话'
    expect: block
    why: 导航可解析、闲聊不可解析

  - id: block-partial-music
    category: partial_parse
    instruction: '拍张照，然后放首歌'
    expect: block
    why: 拍照可解析，放歌不可解析

  - id: block-partial-ac
    category: partial_parse
    instruction: '检查一下电量，然后打开空调'
    expect: block
    why: 查询可解析，开空调不可解析

  - id: block-partial-curtain
    category: partial_parse
    instruction: '回到充电桩，然后关掉音乐'
    expect: block
    why: 回充可解析，关音乐不可解析

  - id: block-partial-poem
    category: partial_parse
    instruction: '往左开半米，然后写首诗'
    expect: block
    why: 相对位移可解析，写诗不可解析

  - id: block-partial-weather
    category: partial_parse
    instruction: '重置里程计，然后播报天气'
    expect: block
    why: 维护动作可解析，天气播报不可解析

  - id: block-partial-curtain2
    category: partial_parse
    instruction: '导航到 (1.0, 0.2)，随后把窗帘拉上'
    expect: block
    why: 导航可解析，拉窗帘不可解析

