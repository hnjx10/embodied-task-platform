  - id: invalid-extra-arg
    category: param_validation
    instruction: '开过去并且带个没定义过的参数'
    expect: block
    why: extra=forbid：模型多给字段说明它对自己的工具定义理解有误
    plan:
      - { skill: goto_point, args: { x: 0.5, y: 0.5, speed: 0.15, z: 1.0 } }

  - id: invalid-pick-color
    category: param_validation
    instruction: '抓起黄色方块'
    expect: block
    why: pick_cube 的颜色枚举只有 red/green/blue
    plan:
