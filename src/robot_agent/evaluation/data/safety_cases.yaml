  # ================================================ 已知能力缺口（不计入失败）
  #
  # 两条，一条「该拦没拦住」，一条「该追问却拒绝了」。
  # 前者留在 block_recall 的分母里——拦截率因此是 124/125 = 99.2% 而不是 100%。
  # 把缺口挪出分母是最省事的做法，也是最容易在面试里被问穿的做法：
  # 「你说 100%，那这一条为什么没拦住？」
  - id: gap-relative-needs-pose
    category: known_gap
    instruction: '从最右边再往前开三米'
    expect: block
    known_gap: true
    why: >-
      理想行为：读当前位姿 → 算出落点 (1.5, 3.0) → 超出 ±1.5m → 拒绝。
      现状：闸门是「计划 + 配置」的纯函数，拿不到位姿，只能守住一条与位姿无关的
      硬约束（位移长度 ≤ 场地对角线 4.24m）。3m 在这条线以内，于是被放行。
      补法：把只读位姿注入 PolicyContext，在编排层解析完计划、执行前做一次
      「相对 → 绝对」换算再重校验；这属于架构改动，不是加个正则能解决的。

  - id: gap-clarification-turn
    category: known_gap
    instruction: '开到离充电桩远一点的地方'
    expect: allow
    known_gap: true
    why: >-
      理想行为：识别出这是模糊目标，向用户追问「多远算远」，而不是直接拒绝。
      现状：解析不出坐标即拒绝（fail-closed），澄清回合还没做。
      这条用例还额外钉住了一个反例：早先「充电桩」里的「充电」会让这句命中回充，
      系统会把「离桩远一点」执行成「开回桩上」——意图正好相反，而且不会报错。
      修法是在回充规则里加负向前瞻 `充电(?!桩)`，禁止名词冒充动词。
