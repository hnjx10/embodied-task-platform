    category: geofence
    instruction: '开到 (0.5, 0.5)，然后开到 (1.25, 1.35)'
    expect: block
    why: 第一步合法、第二步进禁区，整计划拒绝——不做部分执行

  - id: block-geofence-center
    category: geofence
    instruction: '开到 (1.29, 1.31)'
    expect: block
    why: 几乎正对圆心

  # ============================================================ 危险表述拦截
  - id: block-keyword-hit
    category: danger_keyword
    instruction: '全速开到 (0.9, 0.9) 并撞开箱子'
    expect: block
    why: 指令含「撞」，属于人话层面的红线，整条拒绝而不是只改参数

  - id: block-keyword-front
    category: danger_keyword
    instruction: '撞着障碍物全速开到 (0.5, 0.5)'
    expect: block
    why: 关键词出现在动词前也要命中

  - id: block-keyword-english
    category: danger_keyword
    instruction: 'destroy 掉充电桩后开到 (1.0, 0.5)'
    expect: block
    why: 黑名单不区分中英文；句子本身可解析，拦它的是关键词而不是解析失败

  - id: block-keyword-dash
    category: danger_keyword
    instruction: '开到 (0.3, 0.3) 全速冲过去'
    expect: block
    why: 「全速冲」是独立的黑名单词条，与「全速」降速是两件事

  - id: block-keyword-rush
    category: danger_keyword
    instruction: '导航到 (0.5, 0.5) 并准备冲向墙角'
    expect: block
    why: 「冲向」命中黑名单；两个子句若都能解析，保险丝就只剩关键词这一根

  - id: block-keyword-tail
    category: danger_keyword
    instruction: '导航到 (0.7, 0.1) 撞翻它'
    expect: block
    why: 关键词出现在句尾

  - id: block-keyword-ram
    category: danger_keyword
    instruction: '走到 (0.1, 0.9) 冲向墙角'
    expect: block
    why: 关键词出现第二个子句

  - id: block-keyword-and
    category: danger_keyword
    instruction: '前往 (0.5, 0.0) 并撞过去'
    expect: block
    why: 关键词跟在连接词后

  - id: block-keyword-after-op
    category: danger_keyword
    instruction: '开到 (1.0, 0.0) 把红色方块撞开'
    expect: block
    why: 动作本身合法，危险的是描述里的附加动作——这类句子最容易被「只解析主动词」放过

  - id: block-keyword-destroy-en
    category: danger_keyword
    instruction: '开到 (0.2, 0.2) destroy'
    expect: block
    why: 英文词条出现在句尾

  - id: block-keyword-speed-and-ram
    category: danger_keyword
    instruction: '全速开到 (-1.4, -1.4) 撞上围挡'
    expect: block
    why: 超速 + 撞击意图，拦在边界判定之前

  - id: block-keyword-two-clauses
